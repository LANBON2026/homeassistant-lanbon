# Track progress toward Home Assistant Core Bronze (and above).
# Reference: https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Status: done | todo | exempt

rules:
  # --- Bronze ---
  action-setup:
    status: todo
    comment: "Move lanbon.set_channel_name registration to async_setup style when porting to core."
  appropriate-polling:
    status: done
    comment: "WS push primary; 30s HTTP poll fallback."
  brands:
    status: todo
    comment: "Submit logo/icon to home-assistant/brands when opening Core PR."
  category:
    status: done
    comment: "Hub / local panel control."
  config-flow:
