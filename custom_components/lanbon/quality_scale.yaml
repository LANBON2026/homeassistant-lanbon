# Track progress toward Home Assistant Core Bronze (and above).
# Reference: https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Status: done | todo | exempt

rules:
  # --- Bronze ---
  action-setup:
    status: done
    comment: "Service registered on setup; removed when last entry unloads."
  appropriate-polling:
    status: done
    comment: "WS push primary; 30s HTTP poll fallback."
  brands:
    status: exempt
    comment: "HA>=2026.3 local brand/; core_integrations only after Core merge."
  category:
    status: done
    comment: "Hub / local panel control."
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
    comment: "tests/test_config_flow.py (user/zeroconf/auth/connect/not_root)."
