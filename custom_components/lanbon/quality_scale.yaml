    status: done
    comment: "No PyPI deps; aiohttp via HA."
  docs-description:
    status: done
    comment: "docs/lanbon.markdown draft for home-assistant.io."
  docs-installation-instructions:
    status: done
    comment: "README + lanbon.markdown."
  docs-removal-instructions:
    status: done
    comment: "docs/lanbon.markdown Removing section."
  entity-event-setup:
    status: done
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: "LanbonRuntimeData on ConfigEntry.runtime_data."
  test-before-configure:
    status: done
    comment: "config_flow validates via GET /api/v1/info."
  test-before-setup:
    status: done
    comment: "async_config_entry_first_refresh on setup."
  unique-config-entry:
